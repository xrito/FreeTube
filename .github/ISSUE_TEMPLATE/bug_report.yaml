name: Bug report
description: Report a reproducible problem in the FreeTube VOT fork
title: '[Bug]: '
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Report one problem at a time. Never paste Yandex OAuth tokens, cookies, signed media URLs, or private video links.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I tested the latest FreeTube VOT release or development build.
          required: true
        - label: I searched open and closed issues for the same problem.
          required: true
        - label: This report contains no tokens, cookies, or signed media URLs.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Voice translation request
        - Standard voices playback or synchronization
        - Live voices playback or authentication
        - Original or translation volume controls
        - MKV export
        - yt-dlp source download
        - General FreeTube behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a YouTube video
        2. Select a voice mode
        3. Click Translate or Save MKV
        4. Observe the result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and visible error text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FreeTube VOT version or commit
      placeholder: v0.25.2-vot.1 or b0cb42f
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Include only redacted logs and error codes. Remove tokens, cookies, URLs with signatures, and personal data.
