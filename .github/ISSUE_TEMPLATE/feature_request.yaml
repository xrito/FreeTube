name: Feature request
description: Suggest an improvement for the FreeTube VOT fork
title: '[Feature]: '
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Before proposing a feature, check existing issues. This fork is currently scoped to Windows, YouTube, and Russian voice translation.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues for this idea.
          required: true
        - label: This request does not require sharing credentials, cookies, or private media.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice translation controls
        - Live voices
        - Audio synchronization
        - Audio mix or export
        - Diagnostics and troubleshooting
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
